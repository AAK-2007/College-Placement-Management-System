<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student registration')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h1 class="h3 mb-1">Student registration</h1>
    <p class="section-note">Create your login and your placement profile. Fields marked * are required.</p>

    <form th:action="@{/register/student}" th:object="${form}" method="post" novalidate>
        <div class="card mb-3">
            <div class="card-header">Login details</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4" th:insert="~{fragments/form :: input('username', 'User name', true, 'e.g. ananya.rao', 'Letters, digits, dots, dashes or underscores.')}"></div>
                    <div class="col-md-4" th:insert="~{fragments/form :: password('password', 'Password', 'At least 8 characters.')}"></div>
                    <div class="col-md-4" th:insert="~{fragments/form :: password('confirmPassword', 'Confirm password', null)}"></div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Academic profile</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4" th:insert="~{fragments/form :: input('registerNumber', 'Register number', true, 'e.g. 21CS001', null)}"></div>
                    <div class="col-md-5" th:insert="~{fragments/form :: input('name', 'Full name', true, null, null)}"></div>
                    <div class="col-md-3" th:insert="~{fragments/form :: input('department', 'Department', true, 'e.g. CSE', null)}"></div>
                </div>
                <div class="row">
                    <div class="col-md-3" th:insert="~{fragments/form :: input('cgpa', 'CGPA', true, '0 - 10', null)}"></div>
                    <div class="col-md-3" th:insert="~{fragments/form :: input('backlogs', 'Backlogs', true, '0 or more', null)}"></div>
                    <div class="col-md-6" th:insert="~{fragments/form :: input('skills', 'Skills', false, 'e.g. Java, SQL, Python', 'Comma-separated.')}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6" th:insert="~{fragments/form :: input('email', 'Email', false, null, null)}"></div>
                    <div class="col-md-6" th:insert="~{fragments/form :: input('phone', 'Phone', false, null, null)}"></div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Create account</button>
        <a th:href="@{/}" class="btn btn-link">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
