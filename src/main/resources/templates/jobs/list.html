<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jobs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" sec:authorize="hasRole('OFFICER')">Jobs</h1>
        <h1 class="h3 mb-0" sec:authorize="hasRole('STUDENT')">Job openings</h1>
        <h1 class="h3 mb-0" sec:authorize="hasRole('COMPANY')">Our job openings</h1>
        <a th:href="@{/jobs/add}" class="btn btn-primary" sec:authorize="hasRole('OFFICER')">Add job</a>
        <a th:href="@{/jobs/add}" class="btn btn-primary" sec:authorize="hasRole('COMPANY')">Post a job</a>
    </div>

    <!-- Filter by company (not for companies: they only see their own jobs) -->
    <form th:action="@{/jobs}" method="get" class="row g-2 align-items-end mb-3" sec:authorize="!hasRole('COMPANY')">
        <div class="col-sm-6 col-md-4">
            <label for="companyId" class="form-label">Company</label>
            <select id="companyId" name="companyId" class="form-select">
                <option value="">All companies</option>
                <option th:each="c : ${companies}" th:value="${c.companyId}" th:text="${c.name}"
                        th:selected="${c.companyId == selectedCompanyId}">Company</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Show</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(jobs)}" class="alert alert-info">
        <span th:if="${selectedCompanyId == null}">No job openings yet.</span>
        <span th:unless="${selectedCompanyId == null}">No jobs found for this company.</span>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(jobs)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Role</th>
                <th class="text-end">Min CGPA</th>
                <th>Departments</th>
                <th class="text-end">Max backlogs</th>
                <th>Required skills</th>
                <th class="text-end">Package (LPA)</th>
                <th sec:authorize="!hasRole('OFFICER')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="j : ${jobs}">
                <td th:text="${j.jobId}">1</td>
                <td th:text="${companyNames[j.companyId]}">Company</td>
                <td th:text="${j.role}">Role</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(j.minCgpa, 1, 2)}">7.00</td>
                <td th:text="${j.eligibleDepartments}">ALL</td>
                <td class="text-end" th:text="${j.maxBacklogs}">0</td>
                <td th:text="${#strings.isEmpty(j.requiredSkills)} ? '(none)' : ${j.requiredSkills}">Java</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(j.packageLpa, 1, 2)}">6.00</td>
                <td class="text-end text-nowrap" sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/eligibility/explain(jobId=${j.jobId})}" class="btn btn-sm btn-outline-secondary">Check eligibility</a>
                    <span th:if="${appliedJobIds.contains(j.jobId)}" class="badge text-bg-light border ms-1">Applied</span>
                    <a th:unless="${appliedJobIds.contains(j.jobId)}"
                       th:href="@{/applications/apply(jobId=${j.jobId})}" class="btn btn-sm btn-primary">Apply</a>
                </td>
                <td class="text-end" sec:authorize="hasRole('COMPANY')">
                    <a th:href="@{/applications(jobId=${j.jobId})}" class="btn btn-sm btn-outline-secondary">Applicants</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
