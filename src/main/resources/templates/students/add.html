<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add student')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h1 class="h3 mb-3">Add student</h1>

    <form th:action="@{/students/add}" th:object="${form}" method="post" class="card card-body" novalidate>
        <div class="row">
            <div class="col-md-4" th:insert="~{fragments/form :: field('registerNumber', 'Register number', true, 'e.g. 21CS001', 'Must be unique.')}"></div>
            <div class="col-md-5" th:insert="~{fragments/form :: field('name', 'Name', true, null, null)}"></div>
            <div class="col-md-3" th:insert="~{fragments/form :: field('department', 'Department', true, 'e.g. CSE', null)}"></div>
        </div>
        <div class="row">
            <div class="col-md-3" th:insert="~{fragments/form :: field('cgpa', 'CGPA', true, '0 - 10', null)}"></div>
            <div class="col-md-3" th:insert="~{fragments/form :: field('backlogs', 'Backlogs', true, '0 or more', null)}"></div>
            <div class="col-md-6" th:insert="~{fragments/form :: field('skills', 'Skills', false, 'e.g. Java, SQL, Python', 'Comma-separated. Optional.')}"></div>
        </div>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/form :: field('email', 'Email', false, null, 'Optional.')}"></div>
            <div class="col-md-6" th:insert="~{fragments/form :: field('phone', 'Phone', false, null, 'Optional.')}"></div>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Save student</button>
            <a th:href="@{/students}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
