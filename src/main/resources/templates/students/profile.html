<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h1 class="h3 mb-1">My profile</h1>
    <p class="section-note">
        Register number <strong th:text="${student.registerNumber}">REG</strong> (cannot be changed).
        Type only what you want to change; empty fields keep the value shown in grey.
    </p>

    <form th:action="@{/students/me}" th:object="${form}" method="post" class="card" novalidate>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6" th:insert="~{fragments/form :: field('name', 'Full name', false, ${student.name}, null)}"></div>
                <div class="col-md-6" th:insert="~{fragments/form :: field('department', 'Department', false, ${student.department}, null)}"></div>
            </div>
            <div class="row">
                <div class="col-md-3" th:insert="~{fragments/form :: field('cgpa', 'CGPA (0 - 10)', false, ${#numbers.formatDecimal(student.cgpa, 1, 2)}, null)}"></div>
                <div class="col-md-3" th:insert="~{fragments/form :: field('backlogs', 'Backlogs', false, ${student.backlogs}, null)}"></div>
                <div class="col-md-6" th:insert="~{fragments/form :: field('skills', 'Skills', false, ${student.skills}, 'Comma-separated.')}"></div>
            </div>
            <div class="row">
                <div class="col-md-6" th:insert="~{fragments/form :: field('email', 'Email', false, ${student.email}, null)}"></div>
                <div class="col-md-6" th:insert="~{fragments/form :: field('phone', 'Phone', false, ${student.phone}, null)}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
