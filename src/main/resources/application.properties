# ------------------------------------------------------------------
# College Placement System - web version
# Values in ${NAME:default} form are read from environment variables.
# Never write a real password into this file.
# ------------------------------------------------------------------

# Only reachable from this computer.
server.address=127.0.0.1
server.port=8080

# ---- Database (MySQL 8) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# ---- Connection pool (HikariCP) ----
spring.datasource.hikari.pool-name=PlacementPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Give up after 5 seconds when MySQL is down, so the page shows an error quickly.
spring.datasource.hikari.connection-timeout=5000

# ---- Create the users (login accounts) table at startup if it is missing ----
# Safe to run every time (CREATE TABLE IF NOT EXISTS). If MySQL is down, the app still starts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/users-table.sql
spring.sql.init.continue-on-error=true

# ---- Placement officer login ----
# The password is stored only as a BCrypt hash. See README for how to change it.
# The default hash below is for the default password given in the README; change it before real use.
app.officer.username=${OFFICER_USERNAME:officer}
app.officer.password-hash=${OFFICER_PASSWORD_HASH:$2a$10$.Eojk46Ig2dFtgjGeGHDkuSwj93d7BPLqbyLfcuK6bHhWg2mMSlpK}

# ---- Error pages: never show stack traces in the browser ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=false
